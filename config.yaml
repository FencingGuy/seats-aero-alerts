# Trip config. Edit this file for a new trip. Nothing personal belongs here:
# balances and tokens live in GitHub secrets.

origins: [DAD, SGN, HAN, BKK, SIN, HKG, TPE, ICN, TYO]
destinations: [SFO, SJC, OAK, LAX, SEA]
start_date: "2027-01-04"
end_date: "2027-01-11"
cabins: [business, premium, economy]

# Party rule: a find passes with party_size seats in business or premium,
# or with split_rule (one premium seat plus two economy seats on the same record).
party_size: 3
split_rule:
  premium: 1
  economy: 2

# Miles per person. Above these the find is logged but never sent.
ceilings:
  business: 110000
  premium: 75000
  economy: 45000

min_cabin_pct: 75
max_stops: 2

poll_seconds: 180
backoff_seconds: 360
backoff_at_calls: 900
daily_budget: 700

# Which card programs transfer to each mileage program (public knowledge).
transfer_map:
  aeroplan: [amex, chase, capitalone, bilt]
  united: [chase, bilt]
  virginatlantic: [amex, chase, capitalone, bilt, virgin]
  flyingblue: [amex, chase, capitalone, bilt]
  singapore: [amex, chase, capitalone]
  qatar: [amex, capitalone, bilt]
  etihad: [amex, capitalone]
  emirates: [amex, capitalone, bilt]
  turkish: [capitalone, bilt]
  alaska: [bilt]
  american: [bilt]
  delta: [amex]
  qantas: [amex, capitalone]
  finnair: [capitalone, bilt]
  eurobonus: [capitalone, amex]
  velocity: [amex, capitalone]
  lufthansa: []
