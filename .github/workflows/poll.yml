name: Poll seats.aero

on:
  schedule:
    # GitHub drops many top-of-hour schedules; fire off-peak and often.
    # Concurrency below keeps only one run going plus one queued.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep polling (minutes)"
        default: "345"
      dry_run:
        description: "Log only, send nothing to Telegram"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    strategy:
      fail-fast: false
      matrix:
        watch:
          - { name: return, config: config.yaml }
          - { name: outbound, config: config-outbound.yaml }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state from the previous run
        uses: actions/cache/restore@v4
        with:
          path: state
          key: poller-${{ matrix.watch.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: poller-${{ matrix.watch.name }}-

      - run: pip install -r requirements.txt

      - name: Poll
        env:
          SEATS_AERO_API_KEY: ${{ secrets.SEATS_AERO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POINTS_BALANCES: ${{ secrets.POINTS_BALANCES }}
          MINUTES: ${{ github.event.inputs.minutes }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TRIGGER: ${{ github.event_name }}
        run: |
          EXTRA=""
          if [ "$DRY_RUN" = "true" ]; then EXTRA="$EXTRA --dry-run"; fi
          if [ "$TRIGGER" = "workflow_dispatch" ]; then EXTRA="$EXTRA --hello"; fi
          echo "trigger=$TRIGGER extra flags=[$EXTRA]"
          python poller.py --loop --minutes "${MINUTES:-345}" $EXTRA             --config "${{ matrix.watch.config }}" --state "state/${{ matrix.watch.name }}.json"

      - name: Keep the schedule from being auto-disabled after 60 idle days
        if: always() && matrix.watch.name == 'return'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/poll.yml/enable" || true

      - name: Save state for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: poller-${{ matrix.watch.name }}-${{ github.run_id }}-${{ github.run_attempt }}
